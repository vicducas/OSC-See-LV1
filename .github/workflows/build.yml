# Compila OSCSee-LV1 para Mac (Apple Silicon) y Windows en las máquinas de GitHub.
# Uso: pestaña "Actions" → "Compilar OSCSee-LV1" → "Run workflow".
# Al terminar, los archivos quedan abajo en la página de la ejecución, sección "Artifacts".
name: Compilar OSCSee-LV1

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  mac:
    runs-on: macos-14            # Mac con Apple Silicon (M1/M2/M3/M4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar descubrimiento del LV1 por IPv6 (como anuncia un LV1 en Mac)
        run: |
          python - <<'EOF'
          import socket, threading, time, lv1_bridge as b
          msg = b.osc_encode("/zDNS", [("s","_waveslv113._tcp"),("s","test"),("i",0),("s","LV1-TEST"),
                                       ("s","169.254.163.211"),("i",61234),("s","fe80::1")])
          def send():
              s = socket.socket(socket.AF_INET6, socket.SOCK_DGRAM)
              s.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_MULTICAST_LOOP, 1)
              idx = socket.if_nametoindex("lo0")
              s.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_MULTICAST_IF, idx)
              for _ in range(30):
                  s.sendto(msg, ("ff02::fb", 13337, 0, idx)); time.sleep(0.2)
          threading.Thread(target=send, daemon=True).start()
          b.local_ipv4s = lambda: ["169.254.46.38"]
          r = b.discover_lv1(timeout=5, log=print)
          print("Resultado:", r)
          assert r == ("169.254.163.211", 61234), r
          print("IPv6 OK")
          EOF
      - name: Compilar la .app
        run: bash build_mac.command
      - name: Probar que la app arranca
        run: |
          "dist/OSCSee-LV1.app/Contents/MacOS/OSCSee-LV1" &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then echo "La app sigue abierta: OK"; kill $PID; else echo "La app se cerró sola"; cat ~/oscsee-lv1.log || true; exit 1; fi
      - name: Empaquetar en .dmg (no se rompe al pasar por Windows, Drive o USB)
        run: |
          mkdir -p dmg && cp -R "dist/OSCSee-LV1.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "OSCSee-LV1" -srcfolder dmg -ov -format UDZO OSCSee-LV1-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OSCSee-LV1-mac
          path: OSCSee-LV1-mac.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar el .exe
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "OSCSee-LV1" lv1_bridge.py
      - uses: actions/upload-artifact@v4
        with:
          name: OSCSee-LV1-windows
          path: dist/OSCSee-LV1.exe
